[project]
name = "zivoo-backend"
version = "0.1.0"
description = "Zivoo cloud backend (modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<0.143",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.15,<2.16",
  "email-validator>=2.2",
  "pyjwt[crypto]>=2.15,<2.16",
  "structlog>=26.1,<26.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<9.2",
  "httpx>=0.28,<0.29",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
