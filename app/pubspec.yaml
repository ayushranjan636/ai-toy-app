name: zivoo
description: "Zivoo parent companion app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.4.2
  flutter_blue_plus: ^2.3.13
  permission_handler: ^13.0.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2

# App icon from the supplied logo (assets/Zivoo-app-logo.png, unaltered).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#DBECE5"
  adaptive_icon_foreground: assets/brand/app-icon-foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
